name: Build and Push

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        env:
          DH_USER: ${{ vars.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DH_TOKEN" | docker login docker.io -u "$DH_USER" --password-stdin

      - name: Build and push
        run: |
          docker build -t ${{ vars.DOCKERHUB_USERNAME }}/node-app:latest .
          docker push ${{ vars.DOCKERHUB_USERNAME }}/node-app:latest

